name: iOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$app" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry FrancyPages-1.0-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrancyPages-ios-unsigned
          path: build/ios/ipa/FrancyPages-1.0-ios-unsigned.ipa
          if-no-files-found: error
